$kind: http-request
description: El email se genera antes de enviar para que la colección se pueda correr varias veces sin dar 409.
url: "{{baseUrl}}/auth/registro"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Empleado Postman",
      "email": "{{emailNuevo}}",
      "password": "empleado123"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('emailNuevo', `empleado${Date.now()}@maspizza.com`);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Responde 201', () => pm.response.to.have.status(201));
      pm.test('No devuelve la contraseña', () => {
        pm.expect(pm.response.json()).to.not.have.property('password');
      });
    language: text/javascript
order: 5000
