$kind: http-request
description: "El token es válido pero el rol no es administrador: verificarRol responde 403."
url: "{{baseUrl}}/auth/registro"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "No Permitido",
      "email": "nopermitido@maspizza.com",
      "password": "empleado123"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenEmpleado}}"
scripts:
  - type: afterResponse
    code: pm.test('Responde 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 8000
