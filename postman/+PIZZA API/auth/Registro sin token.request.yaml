$kind: http-request
url: "{{baseUrl}}/auth/registro"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Sin Token",
      "email": "sintoken@maspizza.com",
      "password": "empleado123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Responde 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 3000
