$kind: http-request
url: "{{baseUrl}}/mesas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id": 99,
      "capacidad": 4,
      "estado": "Libre"
    }
scripts:
  - type: afterResponse
    code: pm.test('Responde 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 3000
