$kind: http-request
url: "{{baseUrl}}/mesas/99"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "estado": "Ocupada"
    }
scripts:
  - type: afterResponse
    code: pm.test('Responde 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
