$kind: http-request
url: "{{baseUrl}}/ingredientes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "activo": true
    }
scripts:
  - type: afterResponse
    code: pm.test('Responde 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 4000
