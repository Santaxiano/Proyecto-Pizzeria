$kind: http-request
url: "{{baseUrl}}/ingredientes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Ingrediente de prueba Postman",
      "activo": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('ingredienteId', pm.response.json().id);
    language: text/javascript
order: 3000
