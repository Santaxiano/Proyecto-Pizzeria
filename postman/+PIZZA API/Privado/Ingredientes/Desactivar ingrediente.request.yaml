$kind: http-request
url: "{{baseUrl}}/ingredientes/{{ingredienteId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "activo": false
    }
scripts:
  - type: afterResponse
    code: pm.test('Responde 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
