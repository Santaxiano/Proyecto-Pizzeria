$kind: http-request
url: "{{baseUrl}}/productos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "",
      "precio": -5
    }
scripts:
  - type: afterResponse
    code: pm.test('Responde 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 2000
