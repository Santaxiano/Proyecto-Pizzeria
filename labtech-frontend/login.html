<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - +Pizza</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header id="header-principal">
    <a href="index.html" class="brand-logo">
      <div class="logo-main">
        <span class="logo-plus">+</span>
        <span class="logo-text">PIZZA</span>
      </div>
      <span class="logo-slogan">Mucho más que pizza libre</span>
    </a>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="login.html" class="activo">Iniciar Sesión</a></li>
    </ul>
  </nav>

  <main>
    <section class="tarjeta" style="max-width: 450px; margin: 0 auto;">
      <h1>Acceso de Empleados</h1>
      <p style="margin-bottom: 1rem;">Ingresá tus datos para acceder a los módulos de gestión.</p>

      <form action="inicio.html" method="get" style="box-shadow: none; border: none; padding: 0;">
        <fieldset>
          <legend>Credenciales</legend>

          <label for="username">Usuario:</label>
          <input type="text" id="username" name="username" required placeholder="Ej: admin / mozo1">

          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" required placeholder="••••••••">
        </fieldset>

        <button type="submit" class="btn" style="width: 100%;">Entrar al Sistema</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 +Pizza. Todos los derechos reservados.</p>
    <p><a href="index.html" style="color: var(--color-blanco);">Volver a la portada</a></p>
  </footer>

</body>
</html>
