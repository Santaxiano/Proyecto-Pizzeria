<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - +Pizza</title>
    <link rel="stylesheet" href="estilo-principal.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">🍕 +Pizza</a>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="pagina1.html">Reservas</a></li>
            <li><a href="pagina2.html">Menú</a></li>
            <li><a href="pagina3.html">Contacto</a></li>
            <li><a href="pagina4.html">Productos</a></li>
            <li><a href="login.html">Salir</a></li>
        </ul>
    </nav>

    <main class="main-container">
        <form id="loginForm" class="login-form" action="pagina1.html" method="post">
            <h2>Iniciar Sesión</h2>
            
            <label for="username">Usuario:</label>
            <input type="text" id="username" name="username" required placeholder="Tu usuario">

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required placeholder="Tu contraseña">

            <div class="form-options">
                <label for="remember">
                    <input type="checkbox" id="remember" name="remember">
                    Recuérdame
                </label>
                <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-login btn-primary">Ingresar al Sistema</button>
        </form>
    </main>

    <footer>    

    </footer>
</body>
</html>
