<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - +Pizza</title>
    <link rel="stylesheet" href="estilo-principal.css">
</head>
<body>
    <header class="main-header">
        <a href="index.html" class="brand-logo">
        <div class="logo-main">
        <span class="logo-plus">+</span>
        <span class="logo-text">PIZZA</span>
        </div>
        <span class="logo-slogan">MUCHO MÁS QUE PIZZA LIBRE</span>
  </a>
    </header>

    <main class="main-container">
        <form id="loginForm" class="login-form" action="inicio.html" method="get">
            <h2>Iniciar Sesión</h2>
            
            <label for="username">Usuario:</label>
            <input type="text" id="username" name="username" required placeholder="Tu usuario">

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required placeholder="Tu contraseña">

            <div class="form-options">
                <label for="remember">
                    <input type="checkbox" id="remember" name="remember">
                    Recuérdame
                </label>
                <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-login btn-primary">Ingresar al Sistema</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Sistema de Gestión +Pizza.</p>
    </footer>
</body>
</html>
