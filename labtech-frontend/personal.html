<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal - +Pizza</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

<header id="header-principal">
  <a href="index.html" class="brand-logo">
    <div class="logo-main">
      <span class="logo-plus">+</span>
      <span class="logo-text">PIZZA</span>
    </div>
    <span class="logo-slogan">Mucho más que pizza libre</span>
  </a>
</header>

  <nav>
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="salon.html">Salón</a></li>
      <li><a href="productos.html">Productos</a></li>
      <li><a href="personal.html" class="activo">Personal</a></li>
    </ul>
  </nav>

  <main>
    <!-- PARTE C - Ejercicio 4: Formulario con text, email, date/number, select, textarea y labels for/id -->
    <form action="#" method="POST">
      <fieldset>
        <legend>Alta de Nuevo Empleado</legend>

        <label for="nombre">Nombre Completo:</label>
        <input type="text" id="nombre" name="nombre" required placeholder="Ej: Lucas Martínez">

        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email" required placeholder="empleado@maspizza.com">

        <label for="fecha-ingreso">Fecha de Ingreso:</label>
        <input type="date" id="fecha-ingreso" name="fecha-ingreso" min="2020-01-01" max="2026-12-31" required>

        <label for="puesto">Puesto de Trabajo:</label>
        <select id="puesto" name="puesto" required>
          <option value="">-- Seleccione un puesto --</option>
          <option value="pizzero">Pizzero</option>
          <option value="mozo">Mozo / Salón</option>
          <option value="cajero">Cajero</option>
        </select>

        <label for="horas">Horas Semanales Asignadas:</label>
        <input type="number" id="horas" name="horas" min="10" max="48" value="30" required>

        <label for="observaciones">Observaciones adicionales:</label>
        <textarea id="observaciones" name="observaciones" rows="4" placeholder="Disponibilidad horaria o notas relevantes..."></textarea>
      </fieldset>

      <button type="submit" class="btn">Registrar Empleado</button>
      <button type="reset" class="btn btn-secundario">Limpiar</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 +Pizza. Todos los derechos reservados.</p>
    <p><a href="index.html" style="color: white;">Volver a Inicio</a></p>
  </footer>

</body>
</html>
